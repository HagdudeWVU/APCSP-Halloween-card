<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,inital-scale=10">
        <title>boo</title>
        <link rel="stylesheet" href="styles2.css">
    </head>
   <body>
    <video autoplay muted playsinline id="jumpscare">
           <source src="jumpscare.mp4">
    </video>
    <audio id="boo" src="boo.mp3" preload="auto"></audio>
    <script>
        const v = document.getElementById('jumpscare');
        const a = document.getElementById('boo');
        const BOO_AT = 2.03; // when the boo hits in the video (seconds) — tune while watching
        a.muted = true;  // start silent so decode latency is absorbed before the cut
        a.volume = 0.5;  // quieter
        let booed = false;
        // audio plays from the video's start, muted; unmute at the cut = instant, no start latency
        function tick(){
            if(!booed && v.currentTime >= BOO_AT){ booed = true; a.currentTime = 0; a.muted = false; } // rewind to the attack, then unmute = instant
            requestAnimationFrame(tick);
        }
        function arm(){
            booed = false; a.currentTime = 0; a.muted = true;
            a.play().catch(()=>{}); // starts right as the video does
        }
        v.addEventListener('play', arm);
        tick();
        // ponytail: if muted autoplay is blocked, restart the whole scare on first gesture
        function restart(){ booed = false; v.currentTime = 0; v.play(); }
        document.addEventListener('pointerdown', restart, {once:true});
        document.addEventListener('keydown', restart, {once:true});
    </script>
   </body>
</html>
